server {
  listen       8080;
  server_name  localhost;

  root   /usr/share/nginx/html;
  index  index.html;

  # Compresion (mejora tiempos de carga del bundle JS).
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_min_length 1024;

  # SPA routing: si la URL no matchea un archivo,
  # devolver index.html para que Angular maneje la ruta.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy /api/bonos
  location /api/bonos {
    proxy_pass http://bonos-service:8006;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Proxy /api/apuestas
  location /api/apuestas {
    proxy_pass http://apuestas-service:8005;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Proxy /api/estadisticas
  location /api/estadisticas {
    proxy_pass http://estadisticas-service:8007;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Proxy other /api/* to casino-backend
  location /api/ {
    proxy_pass http://casino-backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
  }

  # Cache largo para assets con hash en el nombre.
  location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Sin cache para index.html: siempre se descarga la version nueva.
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
